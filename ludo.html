<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Game Board</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #222;
      font-family: Arial, sans-serif;
    }

    .board {
      width: 600px;
      height: 600px;
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows: repeat(15, 1fr);
      border: 5px solid #111;
      background: white;
    }

    /* Home areas */
    .home {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #111;
    }

    .red {
      background: #e53935;
    }

    .green {
      background: #43a047;
    }

    .yellow {
      background: #fdd835;
    }

    .blue {
      background: #1e88e5;
    }

    /* Home pieces area */
    .home-inner {
      width: 70%;
      height: 70%;
      background: white;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 15px;
      padding: 15px;
      box-shadow: inset 0 0 0 2px #222;
    }

    .piece {
      border-radius: 50%;
      border: 3px solid #222;
    }

    .red .piece {
      background: #e53935;
    }

    .green .piece {
      background: #43a047;
    }

    .yellow .piece {
      background: #fdd835;
    }

    .blue .piece {
      background: #1e88e5;
    }

    /* Board cells */
    .cell {
      border: 1px solid #555;
      background: #fff;
    }

    /* Colored paths */
    .red-cell {
      background: #ef5350;
    }

    .green-cell {
      background: #66bb6a;
    }

    .yellow-cell {
      background: #ffee58;
    }

    .blue-cell {
      background: #42a5f5;
    }

    /* Safe cells */
    .safe {
      position: relative;
    }

    .safe::after {
      content: "★";
      color: #333;
      font-size: 18px;
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Center */
    .center {
      grid-column: 7 / 10;
      grid-row: 7 / 10;
      position: relative;
      overflow: hidden;
      border: 2px solid #111;
      background: conic-gradient(
        #e53935 0deg 90deg,
        #43a047 90deg 180deg,
        #1e88e5 180deg 270deg,
        #fdd835 270deg 360deg
      );
    }

    .center::after {
      content: "";
      position: absolute;
      inset: 25%;
      background: white;
      clip-path: polygon(
        50% 0%,
        100% 50%,
        50% 100%,
        0% 50%
      );
    }

    /* Four home boxes */
    .red-home {
      grid-column: 1 / 7;
      grid-row: 1 / 7;
    }

    .green-home {
      grid-column: 10 / 16;
      grid-row: 1 / 7;
    }

    .yellow-home {
      grid-column: 1 / 7;
      grid-row: 10 / 16;
    }

    .blue-home {
      grid-column: 10 / 16;
      grid-row: 10 / 16;
    }

    /* Path cells */
    .path-top {
      grid-column: 7 / 10;
      grid-row: 1 / 7;
    }

    .path-left {
      grid-column: 1 / 7;
      grid-row: 7 / 10;
    }

    .path-right {
      grid-column: 10 / 16;
      grid-row: 7 / 10;
    }

    .path-bottom {
      grid-column: 7 / 10;
      grid-row: 10 / 16;
    }

    /* Create path layouts */
    .path {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(6, 1fr);
    }

    .horizontal-path {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }

    @media (max-width: 650px) {
      .board {
        width: 95vw;
        height: 95vw;
        max-width: 600px;
        max-height: 600px;
      }

      .home-inner {
        gap: 5px;
        padding: 7px;
      }

      .piece {
        border-width: 2px;
      }
    }
  </style>
</head>

<body>

  <div class="board">

    <!-- Red Home -->
    <div class="home red red-home">
      <div class="home-inner">
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
      </div>
    </div>

    <!-- Green Home -->
    <div class="home green green-home">
      <div class="home-inner">
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
      </div>
    </div>

    <!-- Top Path -->
    <div class="path path-top">

      <div class="cell"></div>
      <div class="cell green-cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell green-cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell green-cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell green-cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell green-cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell green-cell"></div>
      <div class="cell"></div>

    </div>

    <!-- Left Path -->
    <div class="horizontal-path path-left">

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell red-cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>

      <div class="cell red-cell"></div>
      <div class="cell red-cell"></div>
      <div class="cell red-cell"></div>
      <div class="cell red-cell"></div>
      <div class="cell red-cell"></div>
      <div class="cell red-cell"></div>

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell red-cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>

    </div>

    <!-- Right Path -->
    <div class="horizontal-path path-right">

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell blue-cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>

      <div class="cell blue-cell"></div>
      <div class="cell blue-cell"></div>
      <div class="cell blue-cell"></div>
      <div class="cell blue-cell"></div>
      <div class="cell blue-cell"></div>
      <div class="cell blue-cell"></div>

      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell blue-cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>

    </div>

    <!-- Bottom Path -->
    <div class="path path-bottom">

      <div class="cell"></div>
      <div class="cell yellow-cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell yellow-cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell yellow-cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell yellow-cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell yellow-cell"></div>
      <div class="cell"></div>

      <div class="cell"></div>
      <div class="cell yellow-cell"></div>
      <div class="cell"></div>

    </div>

    <!-- Yellow Home -->
    <div class="home yellow yellow-home">
      <div class="home-inner">
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
      </div>
    </div>

    <!-- Blue Home -->
    <div class="home blue blue-home">
      <div class="home-inner">
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
      </div>
    </div>

    <!-- Center -->
    <div class="center"></div>

  </div>

</body>
</html>
